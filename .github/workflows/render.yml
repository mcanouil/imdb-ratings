on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
    paths:
      - data/theatres.csv
  workflow_dispatch:

name: Render

# The default GITHUB_TOKEN only needs to read the repo for checkout; every write
# (push, PR create, merge) is done with the GitHub App installation token.
permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Get the token
        id: token
        uses: mcanouil/release-actions/token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          app-key: ${{ secrets.APP_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.token.outputs.token }}

      - name: Install fonts
        shell: bash
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ttf-mscorefonts-installer fonts-firacode
          sudo fc-cache -f

      - name: Install R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::here
            any::data.table
            any::ggplot2
            any::marquee
            any::scales
            any::lubridate
            any::systemfonts
            any::svglite
            any::jsonlite
            any::rvest
            any::httr2

      - name: Render figures
        shell: bash
        run: Rscript scripts/imdb-ratings.r

      - name: Land the figures
        uses: mcanouil/release-actions/land@v1
        with:
          mode: pull-request
          files: media
          message: "ci: automatic figure rendering"
          branch: ci/render-figures
          allow-unchanged: true
          token: ${{ steps.token.outputs.token }}
